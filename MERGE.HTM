        </STYLE>
        <SCRIPT TYPE="TEXT/JAVASCRIPT">
            function RUN(){
                GtE("OUT").value = "";
                var d1 = GtE("INP01").value;
                var d2 = GtE("INP02").value;
                var H1 = d1.split(/\n/);
                var H2 = d2.split(/\n/);
                var R = "";
                var Q = 0;
                for (var i = 0; i < Math.max(H1.length, H2.length); i++){
                    if (R != "") R += "\n";
                    var Z = "";
                    var MO = false;
                    if (i < H1.length){
                        if (!H1[i].trim().startsWith("%n?", 0)){
                            Z = H1[i];
                            if (H1[i].trim().startsWith("%o?", 0)){
                                Z = H1[i].trim().substr(3);
                                MO = true;
                            }
                        }
                    }
                    if (i < H2.length && !MO){
                        if (!H2[i].trim().startsWith("%n?", 0)){
                            if (H2[i].trim().startsWith("%o?", 0))
                                Z = H2[i].trim().substr(3);
                            else
                                Z += ""+H2[i];
                        }
                    }
                    R += ""+Z;
                    Q++;
                }
                GtE("OUT").value = R;
                GtE("RECORDS").innerHTML = Q;
            }
            
            function GtE(id){
                return document.getElementById(id);
            }
        </SCRIPT>
